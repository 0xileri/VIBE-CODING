<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ILERI — OG card source</title>
<!--
  Source for public/og.jpg — the 1200x630 social share card.
  Open this file in a browser and screenshot the .card element at 1200x630
  (2x for retina), then save over public/og.jpg. Paths are relative, so it
  renders correctly straight from disk.
-->
<style>
  /* Fonts declared with relative paths so the card renders straight from disk;
     public/fonts/fonts.css uses absolute /fonts/ paths that only resolve when served. */
  @font-face {
    font-family: 'Fraunces'; font-style: normal; font-weight: 400 900; font-display: block;
    src: url(../public/fonts/fraunces-400-900-latin.woff2) format('woff2');
  }
  @font-face {
    font-family: 'Fraunces'; font-style: italic; font-weight: 400 900; font-display: block;
    src: url(../public/fonts/fraunces-400-900-italic-latin.woff2) format('woff2');
  }
  @font-face {
    font-family: 'Inter'; font-style: normal; font-weight: 400 700; font-display: block;
    src: url(../public/fonts/inter-400-700-latin.woff2) format('woff2');
  }
  @font-face {
    font-family: 'JetBrains Mono'; font-style: normal; font-weight: 400 500; font-display: block;
    src: url(../public/fonts/jetbrains-mono-400-500-latin.woff2) format('woff2');
  }

  * { box-sizing: border-box; margin: 0; }
  body { background: #222; display: grid; place-items: center; min-height: 100vh; }

  .card {
    width: 1200px;
    height: 630px;
    position: relative;
    overflow: hidden;
    display: grid;
    grid-template-columns: 1fr 400px;
    align-items: center;
    gap: 56px;
    padding: 72px;
    background:
      radial-gradient(760px 460px at 4% -12%, rgba(245, 183, 52, 0.16), transparent 62%),
      radial-gradient(620px 420px at 104% 8%, rgba(251, 143, 44, 0.10), transparent 58%),
      #08080a;
    font-family: 'Inter', system-ui, sans-serif;
    color: #a5a09a;
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #a5a09a;
    margin-bottom: 30px;
  }

  .dot { width: 11px; height: 11px; border-radius: 50%; background: #4ade80; }

  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: 78px;
    line-height: 0.96;
    letter-spacing: -0.035em;
    color: #f6f2e9;
  }

  h1 em { font-style: italic; font-weight: 400; color: #f5b734; }
  h1 .thin { font-weight: 400; color: #a5a09a; }

  .meta {
    display: flex;
    gap: 34px;
    margin-top: 38px;
    padding-top: 26px;
    border-top: 1px solid rgba(246, 242, 233, 0.14);
  }

  .meta div { display: flex; flex-direction: column; gap: 5px; }

  .meta b {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 42px;
    font-weight: 600;
    letter-spacing: -0.03em;
    color: #f6f2e9;
  }

  .meta b span { color: #f5b734; }

  .meta small {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #a5a09a;
  }

  .portrait { display: flex; flex-direction: column; gap: 14px; }

  .frame {
    border: 1px solid rgba(246, 242, 233, 0.16);
    border-radius: 5px;
    padding: 12px;
    background: linear-gradient(180deg, rgba(246, 242, 233, 0.06), transparent);
  }

  .frame img {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 3px;
  }

  .credit {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
  }

  .credit .name {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #f6f2e9;
  }

  .credit .handle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    letter-spacing: 0.1em;
    color: #f5b734;
  }
</style>
</head>
<body>
  <div class="card">
    <div>
      <p class="eyebrow"><span class="dot"></span>Builder · AI video · Web3 growth</p>
      <h1>
        Content that<br />
        <em>earns</em> attention<br />
        <span class="thin">— and keeps it.</span>
      </h1>
      <div class="meta">
        <div><b><span>$</span>3K</b><small>Hackathon win</small></div>
        <div><b>20<span>+</span></b><small>Ecosystems won</small></div>
        <div><b>9,200<span>+</span></b><small>Followers on X</small></div>
      </div>
    </div>

    <figure class="portrait">
      <div class="frame"><img src="../src/assets/avatar.jpg" alt="ILERI" /></div>
      <figcaption class="credit"><span class="name">ILERI</span><span class="handle">@0xileri</span></figcaption>
    </figure>
  </div>
</body>
</html>
